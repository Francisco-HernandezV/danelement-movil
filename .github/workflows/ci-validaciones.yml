name: CI - Validaciones Automáticas

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'

jobs:
  verificacion_codigo:
    name: Revisión de Linter y Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint